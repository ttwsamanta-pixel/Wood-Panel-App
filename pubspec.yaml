name: wood_panel_app
description: Premium Wood & Panel news and magazine mobile application.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.1
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.2
  flutter_svg: ^2.0.16
  flutter_tts: ^4.2.0
  flutter_widget_from_html: ^0.15.3
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  intl: ^0.20.1
  path_provider: ^2.1.6
  share_plus: ^10.1.2
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  video_player: ^2.9.2
  xml: ^7.0.1
  youtube_player_iframe: ^6.0.2
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - logo.svg
